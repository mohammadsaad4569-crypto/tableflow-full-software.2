services:
  - type: web
    name: tableflow-demo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run install:all && npm run db:generate && npm run build
    startCommand: npm run db:push && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_MODE
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: tableflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: APP_URL
        value: https://tableflow-demo.onrender.com
      - key: CORS_ORIGIN
        value: https://tableflow-demo.onrender.com

databases:
  - name: tableflow-db
    databaseName: tableflow
    user: tableflow
    plan: free
    region: singapore
