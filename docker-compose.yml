services:
  db:
    image: postgres:16-alpine
    container_name: tableflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tableflow
      POSTGRES_PASSWORD: tableflow
      POSTGRES_DB: tableflow
    ports:
      - "5432:5432"
    volumes:
      - tableflow_pg:/var/lib/postgresql/data
volumes:
  tableflow_pg:
